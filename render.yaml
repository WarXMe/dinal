services:
  - type: web
    name: multichkr-bot
    runtime: docker
    plan: starter
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: PORT
        value: "8080"
      - key: DB_PATH
        value: "/data/multichkr.db"
    disk:
      name: botdata
      mountPath: /data
      sizeGB: 1
